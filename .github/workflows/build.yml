name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q PrivacyFP-fixed.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build (tries older GeckoView versions in turn)
        working-directory: PrivacyFP
        run: |
          for v in "138.+" "140.+" "136.+" "134.+" "132.+"; do
            echo "=== trying GeckoView $v ==="
            if gradle :app:assembleDebug --no-daemon -PgeckoVersion="$v"; then
              echo "=== OK with GeckoView $v ==="
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: PrivacyFP-debug-apk
          path: PrivacyFP/app/build/outputs/apk/debug/*.apk
